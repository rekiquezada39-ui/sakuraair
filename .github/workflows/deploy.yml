name: Update anime schedule

on:
  schedule:
    # 10:00 UTC = 19:00 Japón / 04:00 CDMX — después del bloque nocturno japonés
    - cron: '0 10 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Generador: gen/fetch.py (AniList) + gen/build.py → public/
      - name: Fetch AniList data
        run: python3 gen/fetch.py || echo "::warning::AniList falló, se usa data/anime.json del repo"

      - name: Build site
        run: python3 gen/build.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=sakuraair --branch=main
