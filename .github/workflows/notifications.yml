name: Deploy notification service
on:
  push:
    branches: [ arena/01a0f5e4-sakuraair ]
    paths: [ 'notifications/**', '.github/workflows/notifications.yml' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notifications
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: notifications/package-lock.json
      - run: npm ci
      - name: Create or find D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: deefae979d0cd5a685e897ad8dec3ac4
        run: |
          set +e
          OUT=$(npx wrangler d1 list --json 2>&1)
          CODE=$?
          set -e
          if [ $CODE -ne 0 ]; then
            echo "::error title=Cloudflare D1 access failed::${OUT//$'\n'/' '}"
            exit $CODE
          fi
          printf '%s' "$OUT" > /tmp/d1.json
          ID=$(node -e "let s=require('fs').readFileSync('/tmp/d1.json','utf8'),a=JSON.parse(s);a=Array.isArray(a)?a:(a.result||a.results||[]);let x=a.find(v=>v.name==='sakuraair-notifications');if(x)process.stdout.write(x.uuid||x.id||'')")
          if [ -z "$ID" ]; then
            npx wrangler d1 create sakuraair-notifications
            npx wrangler d1 list --json > /tmp/d1.json
            ID=$(node -e "let a=JSON.parse(require('fs').readFileSync('/tmp/d1.json','utf8'));a=Array.isArray(a)?a:(a.result||a.results||[]);let x=a.find(v=>v.name==='sakuraair-notifications');if(!x)process.exit(2);process.stdout.write(x.uuid||x.id)")
          fi
          sed -i "s/REPLACE_D1_ID/$ID/" wrangler.toml
          npx wrangler d1 execute sakuraair-notifications --remote --file schema.sql
      - name: Derive and store VAPID key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: deefae979d0cd5a685e897ad8dec3ac4
        run: |
          PRIV=$(node -e "const c=require('crypto'),h=c.createHash('sha256').update(process.env.CLOUDFLARE_API_TOKEN+':sakuraair-vapid').digest();process.stdout.write(h.toString('base64url'))")
          printf %s "$PRIV" | npx wrangler secret put VAPID_PRIVATE_KEY
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: deefae979d0cd5a685e897ad8dec3ac4
        run: npx wrangler deploy

# Redeploy after Cloudflare permission update

# Retry after D1 creation
