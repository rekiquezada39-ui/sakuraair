name: Deploy notification service
on:
  push:
    branches: [ arena/01a0f5e4-sakuraair ]
    paths: [ 'notifications/**', '.github/workflows/notifications.yml' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notifications
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: notifications/package-lock.json
      - run: npm ci
      - name: Initialize D1 database
        env:
          NO_COLOR: 1
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: deefae979d0cd5a685e897ad8dec3ac4
        run: npx wrangler d1 execute sakuraair-notifications --remote --file schema.sql
      - name: Derive and store VAPID key
        env:
          NO_COLOR: 1
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: deefae979d0cd5a685e897ad8dec3ac4
        run: |
          PRIV=$(node -e "const c=require('crypto'),h=c.createHash('sha256').update(process.env.CLOUDFLARE_API_TOKEN+':sakuraair-vapid').digest();process.stdout.write(h.toString('base64url'))")
          printf %s "$PRIV" | npx wrangler secret put VAPID_PRIVATE_KEY
      - name: Deploy Worker
        env:
          NO_COLOR: 1
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: deefae979d0cd5a685e897ad8dec3ac4
        run: npx wrangler deploy
      - name: Report Worker URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          SUB=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/deefae979d0cd5a685e897ad8dec3ac4/workers/subdomain" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).result.subdomain))")
          echo "::notice title=Notification Worker URL::https://sakuraair-notifications.${SUB}.workers.dev"

